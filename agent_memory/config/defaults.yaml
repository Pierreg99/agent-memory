# =============================================================================
# Agent Memory - Default configuration
# =============================================================================
window:
  strategy: sliding
  max_tokens: 4000
  keep_last_turns: 12
  reserve_for_response: 800
  pin_system_prompt: true

tokens:
  backend: heuristic
  tiktoken_encoding: cl100k_base
  chars_per_token: 4

summary:
  backend: extractive
  trigger_when_tokens_over: 3000
  max_summary_tokens: 400
  min_messages_to_summarize: 4
  llm:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    endpoint: https://api.openai.com/v1/chat/completions
    temperature: 0.2

vector:
  enabled: true
  backend: hash
  dim: 128
  top_k: 4
  min_similarity: 0.0
  model_name: all-MiniLM-L6-v2
  persist_embeddings: true

persistence:
  enabled: true
  sqlite_path: ":memory:"
  auto_commit: true
  save_long_term_on_add: true

retention:
  enabled: false
  days: 0
  run_on_start: false

session:
  default_id: default
  clear_on_start: false
