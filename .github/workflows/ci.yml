name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q agent_memory tests benchmarks

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run example demo
        run: PYTHONPATH=. python examples/run_demo.py

  benchmark-smoke:
    name: local benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run benchmark
        run: PYTHONPATH=. python benchmarks/run_memory_bench.py

  lint-packaging:
    name: build + import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel and import
        run: |
          pip install dist/*.whl
          python -c "from agent_memory import AgentMemory, __version__; print(__version__); m = AgentMemory.from_config(); print(m.stats()); m.close()"
