[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "agent-memory"
version = "0.2.0"
description = "A modular, configurable memory system for LLM agents — token-aware context windowing, automatic summarization, RAG-style long-term recall, and durable persistence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pierreg99", email = "pierre@cryopg.it" },
]
keywords = [
    "llm",
    "agent",
    "memory",
    "rag",
    "summarization",
    "context-window",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
sentence-transformers = ["sentence-transformers>=2.2"]
dev = [
    "pytest>=8.0",
]
all = [
    "tiktoken>=0.5",
    "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/Pierreg99/agent-memory"
Repository = "https://github.com/Pierreg99/agent-memory"
Issues = "https://github.com/Pierreg99/agent-memory/issues"
Documentation = "https://github.com/Pierreg99/agent-memory/tree/main/docs"
Changelog = "https://github.com/Pierreg99/agent-memory/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "/agent_memory",
    "/tests",
    "/examples",
    "/benchmarks",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
